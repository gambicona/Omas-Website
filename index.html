<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omas Privatwebsite</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-top">
            <div class="header-left">
                <button id="theme-toggle" class="theme-button" onclick="toggleThemeMenu()" aria-haspopup="true" aria-expanded="false">Farbschema</button>
                <div id="theme-menu" class="theme-menu" hidden>
                    <button type="button" onclick="setTheme('standard')">Standard Weiß</button>
                    <button type="button" onclick="setTheme('dark')">Dunkel</button>
                    <button type="button" onclick="setTheme('bright')">Hell</button>
                    <button type="button" onclick="setTheme('highcontrast')">Hoher Kontrast</button>
                    <button type="button" onclick="setTheme('pastell')">Pastell</button>
                    <button type="button" onclick="setTheme('ocean')">Ozean</button>
                    <button type="button" onclick="setTheme('forest')">Wald</button>
                    <button type="button" onclick="setTheme('retro')">Retro</button>
                </div>
            </div>
            <div class="header-center">
                <h1>Omas Videos</h1>
                <nav>
                    <button onclick="switchSection('favorites')" aria-label="Favoriten anzeigen"><span class="nav-icon nav-icon-heart" aria-hidden="true">♥</span> Favoriten</button>
                    <button onclick="switchSection('playlists')" aria-label="Playlists anzeigen"><span class="nav-icon nav-icon-play" aria-hidden="true">▶</span> Playlists</button>
                    <button onclick="window.location.href='time-weather.html'" aria-label="Zeit und Wetter öffnen">Zeit und Wetter</button>
                    <button onclick="window.location.href='games.html'" aria-label="Spiele öffnen">Spiele</button>
                </nav>
            </div>
            <div class="scroll-hint" aria-label="Runterscrollen um alles zu sehen">Runterscrollen um alles zu sehen <span class="scroll-arrow">↓</span></div>
        </div>
    </header>

    <main class="main-content">
        <section id="favorites-section" class="section" style="display: none;">
            <div id="favorites-list" class="video-list"></div>
        </section>

        <section id="playlists-section" class="section" style="display: none;">
            <div id="playlists-list" class="video-list"></div>
        </section>

        
    </main>

    <div id="player-section" class="player-section">
        <div class="player-container">
            <div class="player-main">
                <div id="video-iframe"></div>
                <div class="volume-control">
                    <label for="volume-slider">Lautstärke:</label>
                    <input type="range" id="volume-slider" min="0" max="100" value="5" step="1">
                </div>
                <div class="player-controls toggle-group">
                    <button id="playlist-btn" onclick="togglePlaylist()" aria-label="Zurück zur Playlist">Playlist</button>
                    <button id="single-btn" onclick="toggleSingleVideo()" aria-label="Nur dieses Video wiederholen">Dieses Video</button>
                    <button id="fav-btn" onclick="toggleFavoriteCurrent()" aria-label="Als Favorit speichern">Als Favorit speichern</button>
                    <button onclick="closePlayer()" aria-label="Player schließen">Schließen</button>
                </div>
            </div>
            <aside id="playlist-sidebar" class="player-sidebar">
                <h3>Playlist-Videos</h3>
                <p>Hier werden die anderen Videos der aktuellen Playlist angezeigt.</p>
            </aside>
        </div>
    </div>

    <script src="common.js"></script>
    <script src="videos.js"></script>
    <script src="script.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
