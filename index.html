<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omas Videos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Omas Videos</h1>
        <nav>
            <button onclick="switchSection('all')" aria-label="Alle Videos anzeigen">Alle Videos</button>
            <button onclick="switchSection('favorites')" aria-label="Favoriten anzeigen">Favoriten</button>
            <button onclick="switchSection('games')" aria-label="Spiele anzeigen">Spiele</button>
        </nav>
    </header>

    <section class="welcome">
        <h2>Willkommen</h2>
        <p>Hier können Sie ganz einfach Videos ansehen und Lieblingsvideos speichern.</p>
    </section>

    <main class="main-content">
        <section id="all-section" class="section">
            <div id="video-list" class="video-list"></div>
        </section>

        <section id="favorites-section" class="section" style="display: none;">
            <div id="favorites-list" class="video-list"></div>
        </section>

        <section id="games-section" class="section" style="display: none;">
            <div class="games-section">
                <p>Hier kommen später kleine Spiele hin.</p>
                <div class="game-card">
                    <h3>Puzzle-Spiel – bald verfügbar</h3>
                </div>
            </div>
        </section>
    </main>

    <div id="player-section" class="player-section">
        <div class="player-container">
            <iframe id="video-iframe" src="" allowfullscreen></iframe>
            <div class="player-controls">
                <button onclick="closePlayer()" aria-label="Player schließen">Schließen</button>
                <button onclick="nextVideo()" aria-label="Nächstes Video abspielen">Nächstes Video</button>
            </div>
        </div>
    </div>

    <script src="videos.js"></script>
    <script src="script.js"></script>
</body>
</html>
