<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omas Videos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Omas Videos</h1>
        <nav>
            <button onclick="switchSection('favorites')" aria-label="Favoriten anzeigen">Favoriten</button>
            <button onclick="switchSection('playlists')" aria-label="Playlists anzeigen">Playlists</button>
            <button onclick="switchSection('games')" aria-label="Spiele anzeigen">Spiele</button>
        </nav>
    </header>

    <main class="main-content">
        <section id="favorites-section" class="section" style="display: none;">
            <div id="favorites-list" class="video-list"></div>
        </section>

        <section id="playlists-section" class="section" style="display: none;">
            <div id="playlists-list" class="video-list"></div>
        </section>

        <section id="games-section" class="section" style="display: none;">
            <div class="games-section">
                <p>Hier kommen später kleine Spiele hin.</p>
                <div class="game-card">
                    <h3>Puzzle-Spiel – bald verfügbar</h3>
                </div>
            </div>
        </section>
    </main>

    <div id="player-section" class="player-section">
        <div class="player-container">
            <div class="player-main">
                <div id="video-iframe"></div>
                <div class="player-controls">
                    <button id="single-btn" onclick="toggleSingleVideo()" aria-label="Nur dieses Video wiederholen">Nur dieses Video</button>
                    <button id="playlist-btn" onclick="togglePlaylist()" aria-label="Zurück zur Playlist">Zurück zur Playlist</button>
                    <button id="fav-btn" onclick="toggleFavoriteCurrent()" aria-label="Als Favorit speichern">Als Favorit speichern</button>
                    <button onclick="closePlayer()" aria-label="Player schließen">Schließen</button>
                </div>
            </div>
            <aside id="playlist-sidebar" class="player-sidebar">
                <h3>Playlist-Videos</h3>
                <p>Hier werden die anderen Videos der aktuellen Playlist angezeigt.</p>
            </aside>
        </div>
    </div>

    <script src="videos.js"></script>
    <script src="script.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
