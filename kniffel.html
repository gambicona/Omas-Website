<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kniffel - Omas Videos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-top">
            <div class="header-left">
                <button id="theme-toggle" class="theme-button" onclick="toggleThemeMenu()" aria-haspopup="true" aria-expanded="false">
                    Farbschema
                </button>

                <div id="theme-menu" class="theme-menu" hidden>
                    <button type="button" onclick="setTheme('standard')">Standard Weiß</button>
                    <button type="button" onclick="setTheme('dark')">Dunkel</button>
                    <button type="button" onclick="setTheme('bright')">Hell</button>
                    <button type="button" onclick="setTheme('highcontrast')">Hoher Kontrast</button>
                    <button type="button" onclick="setTheme('pastell')">Pastell</button>
                    <button type="button" onclick="setTheme('ocean')">Ozean</button>
                    <button type="button" onclick="setTheme('forest')">Wald</button>
                    <button type="button" onclick="setTheme('retro')">Retro</button>
                </div>
            </div>

            <div class="header-center">
                <h1>Kniffel</h1>

                <nav>
                    <button onclick="window.location.href='games.html'" aria-label="Zurück zu den Spielen">
                        Zurück zu den Spielen
                    </button>
                    <button onclick="window.location.href='index.html'" aria-label="Zurück zu den Videos">
                        Zurück zu den Videos
                    </button>
                </nav>
            </div>

            <div class="scroll-hint" aria-label="Runterscrollen um alles zu sehen">
                Runterscrollen um alles zu sehen <span class="scroll-arrow">↓</span>
            </div>
        </div>
    </header>

    <main class="main-content">
        <section class="board-game-section">
            <div class="welcome">
                <h2>Kniffel gegen den Computer</h2>
                <p>Würfle bis zu dreimal. Klicke Würfel an, die bleiben sollen. Dann wähle eine Zeile.</p>
            </div>

            <div class="kniffel-layout">
                <aside class="board-game-panel" aria-label="Kniffel Steuerung">
                    <div class="board-game-button-box board-game-button-box-primary">
                        <button id="kniffel-roll-button" type="button">Würfeln</button>
                    </div>
                    <div class="board-game-button-box">
                        <button id="kniffel-new-game-button" type="button">Neues Spiel</button>
                    </div>
                    <div class="board-game-stats">
                        <p>Wurf: <strong id="kniffel-roll-count">0</strong>/3</p>
                        <p>Du: <strong id="kniffel-human-total">0</strong></p>
                        <p>Computer: <strong id="kniffel-bot-total">0</strong></p>
                        <p id="kniffel-bonus-info" class="kniffel-bonus-info"></p>
                    </div>
                    <p id="kniffel-status" class="board-game-status" aria-live="polite"></p>
                </aside>

                <div class="kniffel-play-area">
                    <div id="kniffel-dice" class="kniffel-dice" aria-label="Kniffel Würfel"></div>
                    <p id="kniffel-choice-hint" class="kniffel-choice-hint" hidden></p>
                    <div id="kniffel-scoreboard" class="kniffel-scoreboard" aria-label="Kniffel Wertung"></div>
                </div>
            </div>
        </section>
    </main>

    <script src="common.js"></script>
    <script src="kniffel.js"></script>
</body>
</html>
